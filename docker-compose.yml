services:
  redis:
    image: redis:7-alpine
    container_name: legal-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # 데이터 영속성 보장: 컨테이너 재시작 시 세션 유실 방지를 위한 AOF 모드 활성화
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: legal-rag-app
    ports:
      - "8000:8000"
    # [Dev] 로컬 코드 변경 사항 실시간 동기화 및 핫 리로드(Hot-reload) 활성화
    volumes:
      - .:/app  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    # 컨테이너 네트워크에 맞춘 환경변수 오버라이드 (.env 설정보다 우선 적용)
    environment:
      REDIS_HOST: redis
      SESSION_STORE_BACKEND: redis
      DB_HOST: host.docker.internal
    extra_hosts:
      # Linux Docker 환경에서 host.docker.internal 매핑 지원 (호스트 머신 DB 접속용)
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 애플리케이션 무결성 검증: 치명적 예외(DB 연결 실패 등 status=='error') 시에만 unhealthy 판정
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; d=json.loads(urllib.request.urlopen('http://localhost:8000/health',timeout=3).read()); sys.exit(0 if d.get('status')!='error' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Redis 세션 스토리지 영구 보존용 볼륨 (docker compose down -v 명령어 입력 시에만 초기화)
  redis-data:

# 재실행: docker compose down -> docker compose up -d